name: Release installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified installers as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  encoder:
    name: Windows encoder and corresponding source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64 mingw-w64-common make nasm pkg-config curl xz-utils bzip2
      - name: Build the pinned minimal FFmpeg and x264 sources
        run: bash scripts/build-release-ffmpeg.sh
      - name: Upload encoder, complete source, licenses, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-ffmpeg-win-x64
          path: .local/release-ffmpeg/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: encoder
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
            executable: release/mac-arm64/AI Watch.app/Contents/MacOS/AI Watch
          - platform: mac
            arch: x64
            runner: macos-15-intel
            executable: release/mac/AI Watch.app/Contents/MacOS/AI Watch
          - platform: win
            arch: x64
            runner: windows-latest
            executable: release/win-unpacked/AI Watch.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests on macOS
        if: matrix.platform == 'mac'
        run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install native macOS build tools
        if: matrix.platform == 'mac'
        run: brew install pkg-config nasm
      - name: Build native macOS encoder and libusb from pinned sources
        if: matrix.platform == 'mac'
        run: npm run build:screen-resources:mac
      - name: Build the native macOS screen bridge
        if: matrix.platform == 'mac'
        run: npm run build:screen-bridge:mac
      - name: Test native macOS bridge and real encoding without USB
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          .local/screen-bridge-venv/bin/python -m unittest discover -s screen-bridge/tests -p 'test_*.py'
          (cd screen-bridge/tools/streamd && go test ./... && go vet ./...)
          node scripts/verify-screen-encoder.mjs
      - name: Download this run's source-built encoder
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v4
        with:
          name: release-ffmpeg-win-x64
          path: screen-bridge/resources/ffmpeg
      - name: Verify the encoder source bundle
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $root = (Resolve-Path 'screen-bridge/resources/ffmpeg').Path
          foreach ($line in Get-Content (Join-Path $root 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Invalid encoder checksum entry' }
            $expected, $relative = $Matches[1], $Matches[2]
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root $relative)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Encoder checksum mismatch: $relative" }
          }
      - name: Build the Windows screen bridge
        if: matrix.platform == 'win'
        run: npm run build:screen-bridge
      - name: Test bridge protocol and real encoding without USB
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Push-Location screen-bridge
          ../.local/screen-bridge-venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location screen-bridge/tools/streamd
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          python screen-bridge/tests/smoke_panel_stream_bridge.py --bridge .local/screen-bridge/XANALI-Panel-Bridge/XANALI-Panel-Bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-screen-encoder.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package macOS DMG and ZIP
        if: matrix.platform == 'mac'
        run: npx --no-install electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Package Windows NSIS installer
        if: matrix.platform == 'win'
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Verify macOS bundle and DMG
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          codesign --verify --deep --strict --all-architectures "$(dirname "$(dirname "$(dirname "${{ matrix.executable }}")")")"
          hdiutil verify release/*.dmg
          python3 scripts/verify-release-screen-bridge-macos.py --bridge-root "$(dirname "$(dirname "${{ matrix.executable }}")")/Resources/screen-bridge"
      - name: Smoke test packaged application
        run: npm run test:release -- "${{ matrix.executable }}"
      - name: Verify the packaged Windows bridge and source
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/verify-release-screen-bridge.ps1 -BridgeRoot release/win-unpacked/resources/screen-bridge
      - name: Install Windows package
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/AI-Watch-*-win-x64.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'ai-watch-install'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS failed: $($process.ExitCode)" }
          npm run test:release -- "$installDir/AI Watch.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-release-screen-bridge.ps1 -BridgeRoot "$installDir/resources/screen-bridge"
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/AI-Watch-*.dmg
            release/AI-Watch-*.zip
            release/AI-Watch-*.exe

  publish:
    name: Publish verified release
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Check artifacts and generate checksums
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const expected = ['mac-arm64.dmg', 'mac-arm64.zip', 'mac-x64.dmg', 'mac-x64.zip', 'win-x64.exe']
            .map(suffix => `AI-Watch-${version}-${suffix}`).sort();
          assert.deepEqual(readdirSync('release-assets').sort(), expected);
          const sums = expected.map(name => {
            assert.ok(statSync(`release-assets/${name}`).size > 1000000, `Truncated artifact: ${name}`);
            return `${createHash('sha256').update(readFileSync(`release-assets/${name}`)).digest('hex')}  ${name}`;
          });
          writeFileSync('release-assets/SHA256SUMS.txt', `${sums.join('\n')}\n`);
          JS
      - name: Create draft and verify uploaded bytes before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"
          cp "docs/releases/$tag.md" "$RUNNER_TEMP/release-notes.md"
          printf '\n构建提交：`%s`。\n\n[完整构建与发布记录](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --draft --title "AI Watch $tag" --notes-file "$RUNNER_TEMP/release-notes.md" release-assets/*
          gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`, 'utf8'));
          assert.equal(release.isDraft, true);
          const expected = readdirSync('release-assets').sort();
          assert.deepEqual(release.assets.map(asset => asset.name).sort(), expected);
          for (const name of expected) {
            const bytes = readFileSync(`release-assets/${name}`);
            const asset = release.assets.find(asset => asset.name === name);
            assert.equal(asset.state, 'uploaded');
            assert.equal(asset.size, bytes.length);
            assert.equal(asset.digest, `sha256:${createHash('sha256').update(bytes).digest('hex')}`);
          }
          console.log('All six uploaded assets match their local SHA-256 digests.');
          JS
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false --latest
