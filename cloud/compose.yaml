services:
  relay:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - relay-data:/app/data
      - ./secrets:/app/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    stop_grace_period: 20s
volumes:
  relay-data:
